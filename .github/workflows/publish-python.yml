name: python - Publish

# Publishes to PyPI through trusted publishing (OIDC): register
# innovafour/iforevents-sdks, workflow file publish-python.yml and the `pypi` environment as a trusted
# publisher on the `iforevents` project at pypi.org once; no token is stored.
on:
  push:
    tags:
      - 'python/v[0-9]+.[0-9]+.[0-9]+'

defaults:
  run:
    working-directory: python

permissions:
  actions: read
  statuses: write
  contents: read

jobs:
  runner_build:
    name: Reserve Mac mini for build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    permissions:
      contents: read
      actions: read
      statuses: write
    outputs:
      runner: ${{ steps.choose.outputs.runner }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Choose local runner or GitHub fallback
      id: choose
      env:
        GH_TOKEN: ${{ github.token }}
        FALLBACK_RUNNER: '["ubuntu-latest"]'
        LOCAL_RUNNER_KIND: deploy
        RUNNER_REQUEST_KEY: .github/workflows/publish-python.yml:build
        FORCE_GITHUB: ${{ vars.FORCE_GITHUB_RUNNERS || 'false' }}
      run: python3 .github/scripts/select-runner.py

  build:
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    needs: [runner_build]
    runs-on: ${{ github.run_attempt > 1 && fromJSON('["ubuntu-latest"]') || fromJSON(needs.runner_build.outputs.runner || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Version matches the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/python/v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "$VERSION" || { echo "tag v$TAG != pyproject version $VERSION"; exit 1; }
      - run: python -m pip install --quiet '.[all,dev]' build
      - run: python -m pytest -q
      - run: python -m build --wheel --sdist
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: dist
          path: python/dist/
  runner_publish:
    name: Reserve Mac mini for publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    permissions:
      contents: read
      actions: read
      statuses: write
    outputs:
      runner: ${{ steps.choose.outputs.runner }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Choose local runner or GitHub fallback
      id: choose
      env:
        GH_TOKEN: ${{ github.token }}
        FALLBACK_RUNNER: '["ubuntu-latest"]'
        LOCAL_RUNNER_KIND: deploy
        RUNNER_REQUEST_KEY: .github/workflows/publish-python.yml:publish
        FORCE_GITHUB: ${{ vars.FORCE_GITHUB_RUNNERS || 'false' }}
      run: python3 .github/scripts/select-runner.py
    needs: build

  publish:
    needs: ["build", "runner_publish"]
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    runs-on: ${{ github.run_attempt > 1 && fromJSON('["ubuntu-latest"]') || fromJSON(needs.runner_publish.outputs.runner || '["ubuntu-latest"]') }}
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
