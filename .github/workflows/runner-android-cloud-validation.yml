name: Validate Android SDK cloud baseline
on:
  push:
    branches: [ci/mac-primary-github-fallback]
    paths: [.github/workflows/runner-android-cloud-validation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 71ba5097294033e7b0015e2371a712fccef4b68d
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@cc4fc85e6b35bafd578d5ffbc76a5518407e1af0
        with:
          gradle-version: '8.11.1'
      - run: mvn -q -ntp -pl iforevents -am install -DskipTests
        working-directory: java
      - run: gradle --no-daemon --max-workers=2 assemble --no-configuration-cache
        working-directory: android
      - run: gradle --no-daemon --max-workers=2 test --no-configuration-cache
        working-directory: android
