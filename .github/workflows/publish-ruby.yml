name: ruby - Publish to RubyGems

# Needs RUBYGEMS_API_KEY in the iforevents-sdks repository secrets (an API key with push scope).
on:
  push:
    tags:
      - 'ruby/v[0-9]+.[0-9]+.[0-9]+'

defaults:
  run:
    working-directory: ruby

permissions:
  actions: read
  statuses: write
  contents: read

jobs:
  runner_publish:
    name: Reserve Mac mini for publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    permissions:
      contents: read
      actions: read
      statuses: write
    outputs:
      runner: ${{ steps.choose.outputs.runner }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Choose local runner or GitHub fallback
      id: choose
      env:
        GH_TOKEN: ${{ github.token }}
        FALLBACK_RUNNER: '["ubuntu-latest"]'
        LOCAL_RUNNER_KIND: deploy
        RUNNER_REQUEST_KEY: .github/workflows/publish-ruby.yml:publish
        FORCE_GITHUB: ${{ vars.FORCE_GITHUB_RUNNERS || 'false' }}
      run: python3 .github/scripts/select-runner.py

  publish:
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    needs: [runner_publish]
    runs-on: ${{ github.run_attempt > 1 && fromJSON('["ubuntu-latest"]') || fromJSON(needs.runner_publish.outputs.runner || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ruby/setup-ruby@a4effe49ee8ee5b8b5091268c473a4628afb5651 # v1.245.0
        with:
          ruby-version: '3.3'
      - run: cd iforevents && ruby -Ilib -Itest test/conformance_test.rb
      - name: Version matches the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/ruby/v}"
          V=$(ruby -Iiforevents/lib -e 'require "iforevents/version"; print Iforevents::VERSION')
          [ "$V" = "$TAG" ] || { echo "gem is $V, tag is $TAG"; exit 1; }
      - run: |
          mkdir -p ~/.gem && printf -- "---\n:rubygems_api_key: %s\n" "$RUBYGEMS_API_KEY" > ~/.gem/credentials && chmod 0600 ~/.gem/credentials
          for g in iforevents iforevents-mixpanel iforevents-segment; do (cd $g && gem build $g.gemspec && gem push $g-*.gem); done
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
