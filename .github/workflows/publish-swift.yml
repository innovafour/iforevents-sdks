name: swift - Release

# Swift packages are published by plain X.Y.Z tags on the root Package.swift; this job proves the tagged tree
# builds on macOS and iOS before anyone depends on it.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

defaults:
  run:
    working-directory: swift

permissions:
  actions: read
  statuses: write
  contents: read

jobs:
  runner_verify:
    name: Reserve Mac mini for verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    permissions:
      contents: read
      actions: read
      statuses: write
    outputs:
      runner: ${{ steps.choose.outputs.runner }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Choose local runner or GitHub fallback
      id: choose
      env:
        GH_TOKEN: ${{ github.token }}
        FALLBACK_RUNNER: '["macos-15"]'
        LOCAL_RUNNER_KIND: macos-public
        RUNNER_REQUEST_KEY: .github/workflows/publish-swift.yml:verify
        FORCE_GITHUB: ${{ vars.FORCE_GITHUB_RUNNERS || 'false' }}
      run: python3 .github/scripts/select-runner.py

  verify:
    needs: [runner_verify]
    runs-on: ${{ github.run_attempt > 1 && fromJSON('["macos-15"]') || fromJSON(needs.runner_verify.outputs.runner || '["macos-15"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: swift test
      - run: xcodebuild build -scheme IForevents -destination 'generic/platform=iOS' -skipPackagePluginValidation | tail -3
