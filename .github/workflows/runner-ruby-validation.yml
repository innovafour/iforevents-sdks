name: Validate GitHub Ruby fallback
on:
  push:
    branches: [ci/mac-primary-github-fallback]
    paths:
      - .github/workflows/publish-ruby.yml
      - .github/workflows/runner-ruby-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ruby:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a4effe49ee8ee5b8b5091268c473a4628afb5651
        with:
          ruby-version: '3.3'
      - run: ruby -Ilib -Itest test/conformance_test.rb
        working-directory: ruby/iforevents
