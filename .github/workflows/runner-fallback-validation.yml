name: Validate Mac mini SDK runner
on:
  push:
    branches: [ci/mac-primary-github-fallback]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
  actions: read
jobs:
  choose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.choose.outputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: choose
        env:
          GH_TOKEN: ${{ github.token }}
          FALLBACK_RUNNER: '["macos-15"]'
          LOCAL_RUNNER_KIND: macos-public
          RUNNER_REQUEST_KEY: .github/workflows/runner-fallback-validation.yml:swift
        run: python3 .github/scripts/select-runner.py
  swift:
    needs: choose
    runs-on: ${{ fromJSON(needs.choose.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - name: Verify SDK account isolation
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$(id -un)" = buildrunner
          if sudo -n true 2>/dev/null; then exit 1; fi
          for path in /opt/home-server/ihabitar/secrets /opt/home-server/ihabitar/release /Users/runner/.appstoreconnect; do
            if test -r "$path"; then echo 'Unexpected signing access'; exit 1; fi
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: swift test
        working-directory: swift
      - run: xcodebuild build -scheme IForevents -destination 'generic/platform=iOS' -skipPackagePluginValidation | tail -3
        working-directory: swift
  choose_android:
    needs: swift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.choose.outputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: choose
        env:
          GH_TOKEN: ${{ github.token }}
          FALLBACK_RUNNER: '["ubuntu-latest"]'
          LOCAL_RUNNER_KIND: macos-public
          RUNNER_REQUEST_KEY: .github/workflows/runner-fallback-validation.yml:android
        run: python3 .github/scripts/select-runner.py
  android:
    needs: choose_android
    runs-on: ${{ fromJSON(needs.choose_android.outputs.runner) }}
    timeout-minutes: 25
    steps:
      - name: Verify local macOS runner
        run: test "$RUNNER_ENVIRONMENT" = self-hosted && test "$(id -un)" = buildrunner
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@cc4fc85e6b35bafd578d5ffbc76a5518407e1af0
        with:
          gradle-version: '8.11.1'
      - name: Set up Maven
        run: bash "$GITHUB_WORKSPACE/.github/scripts/setup-maven.sh"
      - run: mvn -q -ntp -pl iforevents -am install -DskipTests
        working-directory: java
      - run: gradle --no-daemon --max-workers=2 assemble --no-configuration-cache
        working-directory: android
      - run: gradle --no-daemon --max-workers=2 test --no-configuration-cache
        working-directory: android
