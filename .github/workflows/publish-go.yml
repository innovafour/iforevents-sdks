name: go - Release

# Go modules are published by tags. Tag the core module (go/vX.Y.Z), then each
# adapter (go/integrations/<name>/vX.Y.Z). This job only proves the tagged tree
# builds and lists the tags to push for the adapters.
on:
  push:
    tags:
      - 'go/v[0-9]+.[0-9]+.[0-9]+'

defaults:
  run:
    working-directory: go

permissions:
  actions: read
  statuses: write
  contents: read

jobs:
  runner_verify:
    name: Reserve Mac mini for verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    permissions:
      contents: read
      actions: read
      statuses: write
    outputs:
      runner: ${{ steps.choose.outputs.runner }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Choose local runner or GitHub fallback
      id: choose
      env:
        GH_TOKEN: ${{ github.token }}
        FALLBACK_RUNNER: '["ubuntu-latest"]'
        LOCAL_RUNNER_KIND: deploy
        RUNNER_REQUEST_KEY: .github/workflows/publish-go.yml:verify
        FORCE_GITHUB: ${{ vars.FORCE_GITHUB_RUNNERS || 'false' }}
      run: python3 .github/scripts/select-runner.py

  verify:
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    needs: [runner_verify]
    runs-on: ${{ github.run_attempt > 1 && fromJSON('["ubuntu-latest"]') || fromJSON(needs.runner_verify.outputs.runner || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: stable
      - run: go vet ./... && go test -race -count=1 ./...
      - name: Adapter tags to push
        run: |
          TAG="${GITHUB_REF#refs/tags/go/}"
          for m in integrations/*; do echo "git tag go/$m/$TAG && git push origin go/$m/$TAG"; done
