name: js - Publish to npm

# Publishes every workspace package on a release tag. Needs NPM_TOKEN
# (automation token for the @iforevents org) in the iforevents-sdks repository secrets.
on:
  push:
    tags:
      - 'js/v[0-9]+.[0-9]+.[0-9]+'

defaults:
  run:
    working-directory: js

permissions:
  actions: read
  statuses: write
  contents: read
  id-token: write

jobs:
  runner_publish:
    name: Reserve Mac mini for publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    permissions:
      contents: read
      actions: read
      statuses: write
    outputs:
      runner: ${{ steps.choose.outputs.runner }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Choose local runner or GitHub fallback
      id: choose
      env:
        GH_TOKEN: ${{ github.token }}
        FALLBACK_RUNNER: '["ubuntu-latest"]'
        LOCAL_RUNNER_KIND: deploy
        RUNNER_REQUEST_KEY: .github/workflows/publish-js.yml:publish
        FORCE_GITHUB: ${{ vars.FORCE_GITHUB_RUNNERS || 'false' }}
      run: python3 .github/scripts/select-runner.py

  publish:
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    needs: [runner_publish]
    runs-on: ${{ github.run_attempt > 1 && fromJSON('["ubuntu-latest"]') || fromJSON(needs.runner_publish.outputs.runner || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: js/package.json
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build && pnpm -r typecheck && pnpm -r test
      - name: Versions match the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/js/v}"
          for f in packages/*/package.json; do
            V=$(node -p "require('./$f').version")
            [ "$V" = "$TAG" ] || { echo "$f is $V, tag is $TAG"; exit 1; }
          done
      - run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
