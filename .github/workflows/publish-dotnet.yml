name: dotnet - Publish to NuGet

# Needs NUGET_API_KEY (push scope for the IForevents.* ids) in the iforevents-sdks repository secrets.
on:
  push:
    tags:
      - 'dotnet/v[0-9]+.[0-9]+.[0-9]+'

defaults:
  run:
    working-directory: dotnet

permissions:
  actions: read
  statuses: write
  contents: read

jobs:
  runner_publish:
    name: Reserve Mac mini for publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    permissions:
      contents: read
      actions: read
      statuses: write
    outputs:
      runner: ${{ steps.choose.outputs.runner }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Choose local runner or GitHub fallback
      id: choose
      env:
        GH_TOKEN: ${{ github.token }}
        FALLBACK_RUNNER: '["ubuntu-latest"]'
        LOCAL_RUNNER_KIND: deploy
        RUNNER_REQUEST_KEY: .github/workflows/publish-dotnet.yml:publish
        FORCE_GITHUB: ${{ vars.FORCE_GITHUB_RUNNERS || 'false' }}
      run: python3 .github/scripts/select-runner.py

  publish:
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    needs: [runner_publish]
    runs-on: ${{ github.run_attempt > 1 && fromJSON('["ubuntu-latest"]') || fromJSON(needs.runner_publish.outputs.runner || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test IForevents.sln --nologo
      - name: Version matches the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/dotnet/v}"
          V=$(grep -o '<Version>[^<]*' Directory.Build.props | sed 's/<Version>//')
          [ "$V" = "$TAG" ] || { echo "props is $V, tag is $TAG"; exit 1; }
      - run: for p in IForevents IForevents.Segment IForevents.PostHog; do dotnet pack src/$p/$p.csproj -c Release -o artifacts --nologo; done
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
