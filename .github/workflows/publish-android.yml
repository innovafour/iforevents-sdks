name: android - Publish to Maven Central

# Uses com.vanniktech.maven.publish: needs ORG_GRADLE_PROJECT_mavenCentralUsername,
# ORG_GRADLE_PROJECT_mavenCentralPassword, ORG_GRADLE_PROJECT_signingInMemoryKey and
# ORG_GRADLE_PROJECT_signingInMemoryKeyPassword in the iforevents-sdks repository secrets.
on:
  push:
    tags:
      - 'android/v[0-9]+.[0-9]+.[0-9]+'

defaults:
  run:
    working-directory: android

permissions:
  actions: read
  statuses: write
  contents: read

jobs:
  runner_publish:
    name: Reserve Mac mini for publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    permissions:
      contents: read
      actions: read
      statuses: write
    outputs:
      runner: ${{ steps.choose.outputs.runner }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Choose local runner or GitHub fallback
      id: choose
      env:
        GH_TOKEN: ${{ github.token }}
        FALLBACK_RUNNER: '["ubuntu-latest"]'
        LOCAL_RUNNER_KIND: deploy
        RUNNER_REQUEST_KEY: .github/workflows/publish-android.yml:publish
        FORCE_GITHUB: ${{ vars.FORCE_GITHUB_RUNNERS || 'false' }}
      run: python3 .github/scripts/select-runner.py

  publish:
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    needs: [runner_publish]
    runs-on: ${{ github.run_attempt > 1 && fromJSON('["ubuntu-latest"]') || fromJSON(needs.runner_publish.outputs.runner || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      # No wrapper is committed; setup-gradle provides Gradle (AGP 8.7 needs 8.9+).
      - uses: gradle/actions/setup-gradle@cc4fc85e6b35bafd578d5ffbc76a5518407e1af0 # v4.2.1
        with:
          gradle-version: '8.11.1'
      # The Android SDK builds on the JVM core from ../java.
      - run: mvn -q -ntp -pl iforevents -am install -DskipTests
        working-directory: java
      - run: gradle --no-daemon test publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
