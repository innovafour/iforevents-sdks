name: java - Publish to Maven Central

# Needs the Sonatype Central portal credentials (CENTRAL_USERNAME, CENTRAL_PASSWORD)
# and a GPG key (GPG_PRIVATE_KEY, GPG_PASSPHRASE) in the iforevents-sdks repository secrets, and the
# com.iforevents namespace verified on central.sonatype.com.
on:
  push:
    tags:
      - 'java/v[0-9]+.[0-9]+.[0-9]+'

defaults:
  run:
    working-directory: java

permissions:
  actions: read
  statuses: write
  contents: read

jobs:
  runner_publish:
    name: Reserve Mac mini for publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    permissions:
      contents: read
      actions: read
      statuses: write
    outputs:
      runner: ${{ steps.choose.outputs.runner }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Choose local runner or GitHub fallback
      id: choose
      env:
        GH_TOKEN: ${{ github.token }}
        FALLBACK_RUNNER: '["ubuntu-latest"]'
        LOCAL_RUNNER_KIND: deploy
        RUNNER_REQUEST_KEY: .github/workflows/publish-java.yml:publish
        FORCE_GITHUB: ${{ vars.FORCE_GITHUB_RUNNERS || 'false' }}
      run: python3 .github/scripts/select-runner.py

  publish:
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    needs: [runner_publish]
    runs-on: ${{ github.run_attempt > 1 && fromJSON('["ubuntu-latest"]') || fromJSON(needs.runner_publish.outputs.runner || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Version matches the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/java/v}"
          V=$(mvn -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          [ "$V" = "$TAG" ] || { echo "pom is $V, tag is $TAG"; exit 1; }
      - run: mvn -B -ntp -P release deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
