name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['2.7', '3.1', '3.3', '3.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ruby/setup-ruby@a4effe49ee8ee5b8b5091268c473a4628afb5651 # v1.245.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: gem install --no-document mixpanel-ruby analytics-ruby
      - run: cd iforevents && ruby -Ilib -Itest test/conformance_test.rb
      - run: cd iforevents-mixpanel && ruby -I../iforevents/lib -Ilib test/mixpanel_test.rb
      - run: cd iforevents-segment && ruby -I../iforevents/lib -Ilib test/segment_test.rb
      - run: for g in iforevents iforevents-mixpanel iforevents-segment; do (cd $g && gem build $g.gemspec); done
      - name: Smoke
        if: ${{ github.event_name == 'push' && matrix.ruby == '3.3' && env.IFOREVENTS_PROJECT_KEY != '' }}
        env:
          IFOREVENTS_PROJECT_KEY: ${{ secrets.SMOKE_PROJECT_KEY }}
          IFOREVENTS_BASE_URL: ${{ vars.SMOKE_BASE_URL || 'https://api.iforevents.com' }}
        run: ruby iforevents/bin/smoke
