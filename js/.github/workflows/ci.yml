name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, build, test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pnpm 11 (packageManager) needs Node 22.13+; the packages themselves run on 18+.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build first: workspace packages type-check against each other's dist/*.d.ts
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - name: No secret ever ships in a bundle
        run: |
          ! grep -rIi "project_secret\|projectSecret\|X-Project-Secret" packages/*/dist --include='*.js' --include='*.cjs' | grep -v 'never belongs\|"projectSecret" in'

  smoke:
    name: Real api smoke
    if: ${{ github.event_name == 'push' }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Ingest into the smoke project
        if: ${{ env.IFOREVENTS_PROJECT_KEY != '' }}
        env:
          IFOREVENTS_PROJECT_KEY: ${{ secrets.SMOKE_PROJECT_KEY }}
          IFOREVENTS_BASE_URL: ${{ vars.SMOKE_BASE_URL || 'https://api.iforevents.com' }}
        run: pnpm --filter @iforevents/node smoke
