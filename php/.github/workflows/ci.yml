name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, curl
          tools: composer:v2
      - run: |
          for pkg in iforevents iforevents-mixpanel iforevents-segment; do
            (cd $pkg && composer install --no-interaction --quiet && vendor/bin/phpunit --colors=never)
          done
      - name: Smoke
        if: ${{ github.event_name == 'push' && matrix.php == '8.3' && env.IFOREVENTS_PROJECT_KEY != '' }}
        env:
          IFOREVENTS_PROJECT_KEY: ${{ secrets.SMOKE_PROJECT_KEY }}
          IFOREVENTS_BASE_URL: ${{ vars.SMOKE_BASE_URL || 'https://api.iforevents.com' }}
        run: php iforevents/bin/smoke.php
