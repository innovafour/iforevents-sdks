name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet '.[all,dev]' build
      - run: python -m pytest -q
      - run: python -m build --wheel --sdist
      - name: Smoke
        if: ${{ github.event_name == 'push' && matrix.python == '3.11' && env.IFOREVENTS_PROJECT_KEY != '' }}
        env:
          IFOREVENTS_PROJECT_KEY: ${{ secrets.SMOKE_PROJECT_KEY }}
          IFOREVENTS_BASE_URL: ${{ vars.SMOKE_BASE_URL || 'https://api.iforevents.com' }}
        run: python scripts/smoke.py
