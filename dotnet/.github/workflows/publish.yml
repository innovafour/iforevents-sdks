name: Publish to NuGet

# Needs NUGET_API_KEY (push scope for the IForevents.* ids) in the repository secrets.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test IForevents.sln --nologo
      - name: Version matches the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          V=$(grep -o '<Version>[^<]*' Directory.Build.props | sed 's/<Version>//')
          [ "$V" = "$TAG" ] || { echo "props is $V, tag is $TAG"; exit 1; }
      - run: for p in IForevents IForevents.Segment IForevents.PostHog; do dotnet pack src/$p/$p.csproj -c Release -o artifacts --nologo; done
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
