name: Publish to Maven Central

# Needs the Sonatype Central portal credentials (CENTRAL_USERNAME, CENTRAL_PASSWORD)
# and a GPG key (GPG_PRIVATE_KEY, GPG_PASSPHRASE) in the repository secrets, and the
# com.iforevents namespace verified on central.sonatype.com.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Version matches the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          V=$(mvn -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          [ "$V" = "$TAG" ] || { echo "pom is $V, tag is $TAG"; exit 1; }
      - run: mvn -B -ntp -P release deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
