name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.22', '1.23', 'stable']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: Core
        run: go vet ./... && go test -race -count=1 ./...
      - name: Adapters
        run: |
          for m in integrations/*; do
            (cd "$m" && go vet ./... && go test -race -count=1 ./...)
          done
      - name: Smoke
        if: ${{ github.event_name == 'push' && env.IFOREVENTS_PROJECT_KEY != '' }}
        env:
          IFOREVENTS_PROJECT_KEY: ${{ secrets.SMOKE_PROJECT_KEY }}
          IFOREVENTS_BASE_URL: ${{ vars.SMOKE_BASE_URL || 'https://api.iforevents.com' }}
        run: go run ./cmd/smoke
